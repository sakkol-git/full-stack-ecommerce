<!-- ─── ANGULAR TEMPLATE: ProductFormComponent ──────────────────────────────── -->
<!-- Identical Tailwind classes to React and Vue versions                          -->
<!-- Uses Angular's [formGroup] / formControlName reactive form directives         -->
<!-- @if / @for are Angular 17+ control flow syntax (replaces *ngIf / *ngFor)      -->

<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
  <div class="w-full max-w-lg rounded-2xl bg-gray-800 p-8 shadow-2xl ring-1 ring-white/10">
    <!-- Modal Header -->
    <h2 class="mb-6 text-2xl font-bold text-white">
      {{ isEditing ? '✏️ Edit Product' : '➕ Add Product' }}
    </h2>

    <form [formGroup]="form" (ngSubmit)="handleSubmit()" novalidate class="space-y-5">
      <!-- Name -->
      <div>
        <label for="product-name" class="mb-1 block text-sm font-medium text-gray-300">
          Product Name *
        </label>
        <input
          id="product-name"
          type="text"
          formControlName="name"
          placeholder="e.g. Mechanical Keyboard"
          [class]="'w-full rounded-lg border bg-gray-700 px-4 py-2.5 text-white placeholder-gray-500 outline-none transition focus:ring-2 focus:ring-indigo-500 ' + (hasError('name','required') ? 'border-red-500' : 'border-gray-600')"
        />
        @if (hasError('name', 'required')) {
          <p class="mt-1 text-xs text-red-400">Name is required</p>
        }
      </div>

      <!-- Description -->
      <div>
        <label for="product-description" class="mb-1 block text-sm font-medium text-gray-300">
          Description
        </label>
        <textarea
          id="product-description"
          rows="3"
          formControlName="description"
          placeholder="Brief product description..."
          class="w-full rounded-lg border border-gray-600 bg-gray-700 px-4 py-2.5 text-white placeholder-gray-500 outline-none transition focus:ring-2 focus:ring-indigo-500"
        ></textarea>
      </div>

      <!-- Price -->
      <div>
        <label for="product-price" class="mb-1 block text-sm font-medium text-gray-300">
          Price ($) *
        </label>
        <input
          id="product-price"
          type="number"
          step="0.01"
          min="0"
          formControlName="price"
          placeholder="0.00"
          [class]="'w-full rounded-lg border bg-gray-700 px-4 py-2.5 text-white placeholder-gray-500 outline-none transition focus:ring-2 focus:ring-indigo-500 ' + (hasError('price','required') || hasError('price','min') ? 'border-red-500' : 'border-gray-600')"
        />
        @if (hasError('price', 'required')) {
          <p class="mt-1 text-xs text-red-400">Price is required</p>
        }
        @if (hasError('price', 'min')) {
          <p class="mt-1 text-xs text-red-400">Price must be greater than 0</p>
        }
      </div>

      <!-- Image URL -->
      <div>
        <label for="product-image" class="mb-1 block text-sm font-medium text-gray-300">
          Image URL
        </label>
        <input
          id="product-image"
          type="url"
          formControlName="image"
          placeholder="https://..."
          class="w-full rounded-lg border border-gray-600 bg-gray-700 px-4 py-2.5 text-white placeholder-gray-500 outline-none transition focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-3 pt-2">
        <button
          type="submit"
          class="flex-1 rounded-lg bg-indigo-600 px-4 py-2.5 font-semibold text-white transition hover:bg-indigo-500 active:scale-95"
        >
          {{ isEditing ? 'Save Changes' : 'Create Product' }}
        </button>
        <button
          type="button"
          (click)="cancel.emit()"
          class="flex-1 rounded-lg border border-gray-600 px-4 py-2.5 font-semibold text-gray-300 transition hover:bg-gray-700 active:scale-95"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
